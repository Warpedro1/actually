name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes (schema, unitários, RF/RNF offline)
        run: pnpm test
      - name: Build do site
        run: pnpm --filter @actually/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Chromium para os testes de navegador
        run: pnpm --filter @actually/web exec playwright-core install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
      - name: Testes de navegador (RF10, RF11, RNF10)
        run: pnpm --filter @actually/web test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
